[package]
name = "dubplate"
version = "1.0.0-alpha.2"
edition = "2021"
rust-version = "1.89"
description = "Copy a list of songs out of a big music library (web page + CLI). Only ever copies."
license = "AGPL-3.0-or-later"
repository = "https://github.com/vampyshiv/dubplate"
publish = false

[dependencies]
calamine = "0.38"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
encoding_rs = "0.8"
regex = "1.13"
self-replace = "1.5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
sha2 = "0.10"
tiny_http = "0.12"
unicode-general-category = "1.1"
unicode-normalization = "0.1"
ureq = { version = "2.12", features = ["json"] }

# rekordbox USB engine from rbxport (GPL-2.0-or-later, https://github.com/chrisle/rbxport),
# pinned to a release. Analysis, ANLZ files, export.pdb / exportLibrary.db, audio conversion.
rbl-analysis = { git = "https://github.com/chrisle/rbxport", tag = "v1.10.0" }
rbl-anlz = { git = "https://github.com/chrisle/rbxport", tag = "v1.10.0" }
rbl-audio = { git = "https://github.com/chrisle/rbxport", tag = "v1.10.0" }
rbl-core = { git = "https://github.com/chrisle/rbxport", tag = "v1.10.0" }
rbl-export = { git = "https://github.com/chrisle/rbxport", tag = "v1.10.0" }
lofty = "0.25"
# rbl-audio decodes with symphonia; also read Ogg Vorbis (rbxport leaves it out)
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
