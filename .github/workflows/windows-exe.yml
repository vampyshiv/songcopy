# Builds songcopy.exe on a real Windows machine, tests it, and (for version tags) publishes it
# as a GitHub Release. Push a tag like v1.1.0 to make a release.
name: Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to attach the .exe to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests on Windows
        run: python -m unittest discover -s tests -v

      - name: Build songcopy.exe
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller --onefile --console --clean --name songcopy songcopy.py

      - name: Smoke test the built exe
        run: python tests/smoke_exe.py dist/songcopy.exe

      - uses: actions/upload-artifact@v4
        with:
          name: songcopy-windows
          path: dist/songcopy.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/songcopy.exe --title "songcopy ${{ github.ref_name }}" --generate-notes
