# Builds songcopy for Windows and Linux on real machines, tests each build, and (for version
# tags) publishes a release with both builds and a SHA256SUMS file the updater checks against.
# Make a release: update CHANGELOG.md and the version in Cargo.toml, then
#   git tag v2.1.0 && git push origin v2.1.0
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: songcopy-windows-x86_64.exe
            bin: target/x86_64-pc-windows-msvc/release/songcopy.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl     # static: runs on any Linux
            asset: songcopy-linux-x86_64
            bin: target/x86_64-unknown-linux-musl/release/songcopy
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add ${{ matrix.target }}
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools ffmpeg; fi

      - name: ffmpeg (so the USB conversion is tested too)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test the built program
        run: python tests/smoke_exe.py ${{ matrix.bin }}

      - name: Name the build
        shell: bash
        run: mkdir -p out && cp "${{ matrix.bin }}" "out/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd out && sha256sum songcopy-* > SHA256SUMS && cat SHA256SUMS && cd ..
          v="${GITHUB_REF_NAME#v}"
          # the section of CHANGELOG.md for this version (between its heading and the next one)
          awk -v v="$v" '/^## /{p = ($2 == v)} p && !/^## /' CHANGELOG.md > notes.md
          test -s notes.md || echo "songcopy $v" > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "songcopy $GITHUB_REF_NAME" --notes-file notes.md
